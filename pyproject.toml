[project]
name = "cropatlas"
version = "0.1.0"
description = "Multi-sensor optical harmonisation and crop phenology over Zimbabwe"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "pyproj>=3.5",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "SIM117"]
"scripts/*" = ["E402"]
